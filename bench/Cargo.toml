# On-board functionality and performance checks for the tinymind crate on a
# NUCLEO-F411RE (Cortex-M4F) and a NUCLEO-L031K6 (Cortex-M0+), mirroring
# tinymind's benchmarks/framework_comparison_f411. Not part of the published
# crate; see README.md and run.sh.
[package]
name = "tinymind-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tinymind = { path = ".." }
cortex-m = "0.7"
cortex-m-rt = "0.7"
# Output and exit under QEMU (features qemu-m4, qemu-m0).
cortex-m-semihosting = { version = "0.5", optional = true }

[features]
# Board (exactly one).
f411 = []
l031 = []
# QEMU instead of a board: correctness only, timings are meaningless. qemu-m4
# is the mps2-an386 machine (Cortex-M4, for thumbv7em-none-eabihf), qemu-m0 the
# microbit (Cortex-M0, the M0+'s instruction set, for thumbv6m-none-eabi). See
# scripts/qemu-bench.sh.
qemu-m4 = ["dep:cortex-m-semihosting"]
qemu-m0 = ["dep:cortex-m-semihosting"]
# Workload (at most one; none builds the empty baseline image for size deltas).
mlp = []
xor-q16 = []
xor-q8 = []
# The anomaly-detection demo: an autoencoder trained on the device.
anomaly = []
# The imported scikit-learn tree models: results, both forms, flash vs SRAM.
trees = []
# Per-layer cycles for the MLP (a separate image, like tinymind's PROFILE build).
profile = ["mlp"]
# tinymind's KWS-shaped int8 CNN, and its per-layer cycles (a separate image).
kws = []
kws-profile = ["kws"]
# The MLPerf Tiny keyword-spotting (DS-CNN) and image-classification (ResNet-8)
# models, translated by tools/import_tflite (F411 only; generate
# bench/src/gen/mlperf_{kws,ic}*.rs with tools/import_tflite/mlperf.py first).
mlperf-kws = []
mlperf-ic = []
# The host test sweeps (tests/sweeps/) against their committed goldens:
# correctness only, for QEMU (scripts/qemu-bench.sh) or a board.
sweeps = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true
