name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Branch protection requires these jobs by their `name:` values ("rust",
# "cpp-equivalence"). Renaming a job, or skipping it with `paths-ignore` or a
# job-level `if:`, leaves the required check unreported and blocks every PR.
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Rust (stable, MSRV, embedded targets)
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy \
            --target thumbv7em-none-eabihf,thumbv6m-none-eabi
          rustup default stable
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          rustc --version
          rustc "+$msrv" --version
      # Later steps run even when an earlier one fails, so a single run reports
      # every broken gate instead of stopping at the first.
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        if: success() || failure()
        # With the std feature (calibration, int8 example) and without it (the
        # no_std library as firmware uses it).
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --lib -- -D warnings
      - name: cargo test
        if: success() || failure()
        run: cargo test --all-features
      # Every Q8.8 operand pair through every operation, against an exact
      # reference (tests/qformat_oracle.rs). Overflow checks stay on in release:
      # without them an unintended plain `+` wraps to the right answer and
      # passes.
      - name: qformat oracle, exhaustive Q8.8 (release, overflow checks on)
        if: success() || failure()
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test --release --test qformat_oracle -- --ignored --nocapture
      - name: cargo doc (warnings are errors)
        if: success() || failure()
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      # The library claims no_std for microcontrollers; build it for two of them.
      # Examples in the quick starts, site links, nav order, CHANGELOG entry for
      # the version, data attribution. Prose is checked by review (CLAUDE.md).
      - name: Docs are current (mechanical checks)
        if: success() || failure()
        run: scripts/check-docs.sh
      - name: Build library for Cortex-M4F and Cortex-M0+
        if: success() || failure()
        run: |
          cargo build --lib --release --target thumbv7em-none-eabihf
          cargo build --lib --release --target thumbv6m-none-eabi
      # Link-time proof that no panic is reachable from the public API: a
      # firmware image whose panic handler is an undefined symbol
      # (ci/panic-never), at the optimisation levels firmware uses.
      - name: No reachable panic (Cortex-M0+ and M4F, opt-level 3, s, z)
        if: success() || failure()
        working-directory: ci/panic-never
        run: |
          cargo fmt --check
          for target in thumbv6m-none-eabi thumbv7em-none-eabihf; do
            for opt in 3 s z; do
              echo "== $target opt-level=$opt"
              CARGO_PROFILE_RELEASE_OPT_LEVEL=$opt cargo build --release --target "$target"
            done
          done
      # What crates.io gets:
      # build the package, reject maintainer-only paths, and run the tests from
      # the unpacked package source.
      - name: cargo package (contents and tests)
        if: success() || failure()
        run: |
          cargo package
          if cargo package --list | grep -E '^(\.github|\.claude|ci|bench|docs|scripts|tools)/|^CLAUDE\.md$'; then
            echo "maintainer-only files would be published" >&2
            exit 1
          fi
          cargo test --all-features --manifest-path "$(ls -d target/package/tinymind-*/ | head -1)Cargo.toml"
      - name: cargo test on MSRV (${{ steps.toolchain.outputs.msrv }})
        if: success() || failure()
        run: cargo "+${{ steps.toolchain.outputs.msrv }}" test --all-features

  # Kani proofs (src/kani_proofs.rs): properties checked for every input.
  # Installed directly (pinned version) rather than through the Kani action,
  # which pulls in a tag-pinned third-party action.
  kani:
    name: kani
    runs-on: ubuntu-latest
    env:
      KANI_VERSION: "0.68.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: cargo kani
        run: cargo kani --output-format terse

  cpp-equivalence:
    name: cpp-equivalence
    runs-on: ubuntu-latest
    steps:
      # Side by side, like a local checkout: actions/checkout only writes under
      # $GITHUB_WORKSPACE, so ../tinymind relative to the workspace root is out.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: tinymind-rs
          persist-credentials: false
      - name: Read TINYMIND_REF
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < tinymind-rs/TINYMIND_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: danmcleran/tinymind
          ref: ${{ steps.ref.outputs.sha }}
          path: tinymind
          persist-credentials: false
      - name: Install Rust (stable, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          g++ --version
      # The PyTorch importer checks in compare-with-cpp.sh need numpy.
      - name: Python with numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.5.4
      - name: Byte-compare the C++ and Rust outputs
        env:
          TINYMIND_DIR: ${{ github.workspace }}/tinymind
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: tinymind-rs/scripts/compare-with-cpp.sh
      # The on-board benchmark (bench/) runs by hand on real boards; CI only
      # keeps every image building. Its MLP is generated from tinymind's sources.
      - name: Build the on-board benchmark images
        if: success() || failure()
        working-directory: tinymind-rs/bench
        env:
          TINYMIND_DIR: ${{ github.workspace }}/tinymind
        run: |
          rustup target add thumbv7em-none-eabihf thumbv6m-none-eabi
          python3 -I gen.py 32
          for spec in f411:thumbv7em-none-eabihf l031:thumbv6m-none-eabi; do
            for wl in "" ",mlp" ",profile" ",xor-q16" ",xor-q8" ",anomaly"; do
              echo "== ${spec%%:*}$wl"
              # Not RUSTFLAGS="-D warnings": it would replace bench/.cargo's -Tlink.x.
              cargo build --release --target "${spec##*:}" --features "${spec%%:*}$wl" 2>&1 | tee build.log
              if grep -q '^warning' build.log; then exit 1; fi
            done
          done
      - name: Check src/lut.rs matches the tables at TINYMIND_REF
        if: success() || failure()
        env:
          TINYMIND_DIR: ${{ github.workspace }}/tinymind
        run: |
          python3 -I tinymind-rs/scripts/extract-luts.py
          git -C tinymind-rs diff --exit-code -- src/lut.rs
