name: Pages

# Builds the docs/ site (Jekyll, just-the-docs, as tinymind's site) with the
# crate's rustdoc output under /api/, and deploys it from master. Pull requests
# build the site without deploying, so a broken page shows up before merge.

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      # baseurl comes from docs/_config.yml (/tinymind-rs).
      - name: Build with Jekyll
        run: bundle exec jekyll build
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Add rustdoc under /api/
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --lib
          cp -r target/doc docs/_site/api
          # /api/ itself has no page in rustdoc output; send it to the crate root.
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=tinymind/"><a href="tinymind/">tinymind API reference</a>' > docs/_site/api/index.html
          test -f docs/_site/api/tinymind/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Write access only where it is used.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
